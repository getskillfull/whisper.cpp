name: Build and Deploy Whisper.cpp with Docker

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ensure IAM role exists and is attached to EC2
        run: |
          ROLE_NAME="EC2-ECR-SSM-Role"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          # Check if role exists, create if it doesn't
          if ! aws iam get-role --role-name $ROLE_NAME &>/dev/null; then
            echo "Creating IAM role: $ROLE_NAME"
            
            # Create trust policy for EC2
            cat > trust-policy.json << EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": "ec2.amazonaws.com"
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
          EOF
            
            # Create the role
            aws iam create-role \
              --role-name $ROLE_NAME \
              --assume-role-policy-document file://trust-policy.json \
              --description "Role for EC2 to access ECR and SSM"
            
            # Attach managed policies
            aws iam attach-role-policy \
              --role-name $ROLE_NAME \
              --policy-arn arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
            
            aws iam attach-role-policy \
              --role-name $ROLE_NAME \
              --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
            
            echo "IAM role created successfully"
          else
            echo "IAM role $ROLE_NAME already exists"
          fi

          # Check if instance profile exists, create if it doesn't
          if ! aws iam get-instance-profile --instance-profile-name $ROLE_NAME &>/dev/null; then
            echo "Creating instance profile: $ROLE_NAME"
            aws iam create-instance-profile --instance-profile-name $ROLE_NAME
            
            # Add role to instance profile
            aws iam add-role-to-instance-profile \
              --instance-profile-name $ROLE_NAME \
              --role-name $ROLE_NAME
            
            # Wait a bit for the instance profile to be ready
            echo "Waiting for instance profile to be ready..."
            sleep 10
          else
            echo "Instance profile $ROLE_NAME already exists"
          fi

          # Check current instance profile attached to EC2
          CURRENT_PROFILE=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].IamInstanceProfile.Arn' \
            --output text 2>/dev/null || echo "None")

          if [[ "$CURRENT_PROFILE" == "None" || "$CURRENT_PROFILE" == *"$ROLE_NAME"* ]]; then
            if [[ "$CURRENT_PROFILE" == "None" ]]; then
              echo "No IAM role attached to instance. Attaching $ROLE_NAME..."
              aws ec2 associate-iam-instance-profile \
                --instance-id $INSTANCE_ID \
                --iam-instance-profile Name=$ROLE_NAME
              
              echo "Waiting for role to take effect..."
              sleep 30
            else
              echo "Correct IAM role already attached to instance"
            fi
          else
            echo "Different IAM role attached. Replacing with $ROLE_NAME..."
            # Get association ID to disassociate current profile
            ASSOCIATION_ID=$(aws ec2 describe-instances \
              --instance-ids $INSTANCE_ID \
              --query 'Reservations[0].Instances[0].IamInstanceProfile.Id' \
              --output text)
            
            if [[ "$ASSOCIATION_ID" != "None" ]]; then
              aws ec2 disassociate-iam-instance-profile \
                --association-id $ASSOCIATION_ID
              
              # Wait for disassociation
              sleep 10
            fi
            
            # Associate new profile
            aws ec2 associate-iam-instance-profile \
              --instance-id $INSTANCE_ID \
              --iam-instance-profile Name=$ROLE_NAME
            
            echo "Waiting for new role to take effect..."
            sleep 30
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/skillfull/whisper:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        run: |
          # Create deployment script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail

          echo "Starting deployment at $(date)"

          # Wait a moment for IAM role to be fully active
          sleep 10

          # Set variables
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          AWS_REGION="${{ vars.AWS_REGION }}"
          IMAGE_URI="${ECR_REGISTRY}/skillfull/whisper:latest"

          echo "Using ECR Registry: $ECR_REGISTRY"
          echo "Using AWS Region: $AWS_REGION"
          echo "Image URI: $IMAGE_URI"

          # Check AWS credentials and permissions
          echo "Checking AWS credentials..."
          aws sts get-caller-identity || {
            echo "ERROR: AWS credentials not available. Waiting for IAM role to take effect..."
            sleep 30
            aws sts get-caller-identity || {
              echo "ERROR: AWS credentials still not available"
              exit 1
            }
          }

          # Test ECR access
          echo "Testing ECR access..."
          aws ecr describe-repositories --region ${AWS_REGION} --max-items 1 || {
            echo "ERROR: Cannot access ECR. Check IAM permissions."
            exit 1
          }

          # Login to ECR
          echo "Logging into ECR..."
          if ! aws ecr get-login-password --region ${AWS_REGION} | sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}; then
            echo "ERROR: ECR login failed"
            exit 1
          fi

          # Pull the latest image
          echo "Pulling Docker image..."
          sudo docker pull ${IMAGE_URI}

          # Stop and remove existing container if it exists
          echo "Stopping existing container..."
          sudo docker stop whisper-cpp || true
          sudo docker rm whisper-cpp || true

          # Create necessary directories
          echo "Creating directories..."
          sudo mkdir -p /opt/whisper/models
          sudo mkdir -p /opt/whisper/samples

          # Run the new container
          echo "Starting new container..."
          sudo docker run -d \
            --name whisper-cpp \
            --restart unless-stopped \
            -v /opt/whisper/models:/app/models \
            -v /opt/whisper/samples:/app/samples \
            ${IMAGE_URI}

          # Verify deployment
          echo "Verifying deployment..."
          sleep 5
          sudo docker ps | grep whisper-cpp || (echo "Container failed to start" && exit 1)

          echo "Whisper.cpp deployed successfully at $(date)!"
          EOF

          # Execute via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"$(cat deploy.sh | base64 -w 0)\"]" \
            --parameters 'commands=["echo $(echo \"'"$(cat deploy.sh | base64 -w 0)"'\" | base64 -d) > /tmp/deploy.sh && chmod +x /tmp/deploy.sh && /tmp/deploy.sh"]' \
            --output text --query 'Command.CommandId')

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }}

          # Get command output
          echo "=== Deployment Output ==="
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardOutputContent' --output text

          # Check for errors
          ERROR_OUTPUT=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'StandardErrorContent' --output text)

          if [[ "$ERROR_OUTPUT" != "None" && "$ERROR_OUTPUT" != "" ]]; then
            echo "=== Deployment Errors ==="
            echo "$ERROR_OUTPUT"
          fi

          # Check if command succeeded
          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Status' --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi

          echo "Deployment completed successfully!"

name: Build and Deploy Whisper.cpp with Docker

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          region: ${{ vars.AWS_REGION }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/skillfull/whisper:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        run: |
          # Create deployment script
          cat > deploy.sh << 'EOL'
          #!/bin/bash
          set -e

          # Install Docker if not installed
          if ! command -v docker &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
          fi

          # Login to ECR
          aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY

          # Pull the latest image
          sudo docker pull $ECR_REGISTRY/skillfull/whisper:latest

          # Stop and remove existing container if it exists
          sudo docker stop whisper-cpp || true
          sudo docker rm whisper-cpp || true

          # Create necessary directories
          sudo mkdir -p /opt/whisper/models
          sudo mkdir -p /opt/whisper/samples

          # Run the new container
          sudo docker run -d \
            --name whisper-cpp \
            --restart unless-stopped \
            -v /opt/whisper/models:/app/models \
            -v /opt/whisper/samples:/app/samples \
            $ECR_REGISTRY/skillfull/whisper:latest

          echo "Whisper.cpp deployed successfully!"
          EOL

          # Execute command on EC2 instance using SSM
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands="$(cat deploy.sh)" \
            --output text
